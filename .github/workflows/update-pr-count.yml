name: Update PR count

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-pr-count.sh

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "Teddy Tennant"
          git config user.email "teddytennant@icloud.com"
          git commit -am "Update merged PR count"
          git push
